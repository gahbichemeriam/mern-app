name: Docker CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/docker-ci.yml'
            client:
              - 'client/**'
              - '.github/workflows/docker-ci.yml'

  build_scan_push:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USER }}/mern-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE:$GITHUB_SHA" "${{ matrix.service }}"

      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          output: trivy_${{ matrix.service }}.txt
          exit-code: '0'

      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy_${{ matrix.service }}.txt

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        run: docker push "$IMAGE:$GITHUB_SHA"